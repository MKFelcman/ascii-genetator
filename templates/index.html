<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color ASCII Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@500&display=swap"
        rel="stylesheet">
    <style>
        /* --- Moderní čistý vzhled --- */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* Světle šedá */
            color: #1f2937;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #111827;
            font-weight: 800;
            margin-bottom: 20px;
        }

        /* --- Ovládací karta --- */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        input[type="file"] {
            margin-bottom: 15px;
            width: 100%;
        }

        .select-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        select,
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            background-color: #2563eb;
            /* Modrá */
            color: white;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* --- Výsledek --- */
        .art-wrapper {
            background-color: #111827;
            /* Tmavé pozadí pod obrázkem pro kontrast */
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            overflow: auto;
            max-width: 100%;
        }

        .ascii-art {
            font-family: 'Roboto Mono', monospace;
            white-space: pre;
            /* Zachová mezery */
            line-height: 0.8;
            /* DŮLEŽITÉ: Sníží řádkování, aby to nebylo roztažené */
            letter-spacing: 0;
            font-weight: bold;
            text-align: left;
            /* Zarovnání vlevo je pro ASCII nutnost */
        }

        /* Velikosti písma podle nastavení */
        .size-50 {
            font-size: 8px;
        }

        /* Pro mobil */
        .size-100 {
            font-size: 6px;
        }

        .size-150 {
            font-size: 4px;
        }

        .size-200 {
            font-size: 3px;
        }
    </style>
</head>

<body>

    <h1>🎨 Color ASCII Generator</h1>

    <div class="controls">
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>

            <div class="select-group">
                <label for="width" style="align-self: center;">Velikost:</label>
                <select name="width" id="width">
                    <option value="50" {% if current_width==50 %}selected{% endif %}>📱 Mobil (50 znaků)</option>
                    <option value="100" {% if current_width==100 %}selected{% endif %}>💻 PC Standard (100 znaků)
                    </option>
                    <option value="150" {% if current_width==150 %}selected{% endif %}>🖥️ HD (150 znaků)</option>
                    <option value="200" {% if current_width==200 %}selected{% endif %}>🔥 Ultra (200 znaků)</option>
                </select>
            </div>

            <button type="submit">Obarvit a převést</button>
        </form>
    </div>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if ascii_art %}
    <div class="art-wrapper">
        <div class="ascii-art size-{{ current_width }}">
            {{ ascii_art }}
        </div>
    </div>
    <p style="font-size: 12px; color: #6b7280; margin-top: 10px;">
        Tip: Na mobilu si obrázek přibližuj prsty.
    </p>
    {% endif %}

</body>

</html>
