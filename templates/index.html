<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #111827;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto 30px auto;
        }

        input[type="file"] {
            margin-bottom: 15px;
            width: 100%;
        }

        /* Skupina pro výběry vedle sebe */
        .options-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        select,
        button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            cursor: pointer;
            flex: 1;
            /* Aby zabraly stejné místo */
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .art-wrapper {
            background-color: #0d1117;
            /* Velmi tmavá, skoro černá */
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            overflow: auto;
            max-width: 100%;
        }

        .ascii-art {
            font-family: 'Roboto Mono', monospace;
            white-space: pre;
            line-height: 0.8;
            letter-spacing: 0;
            font-weight: bold;
            text-align: left;
        }

        .size-50 {
            font-size: 8px;
        }

        .size-100 {
            font-size: 6px;
        }

        .size-150 {
            font-size: 4px;
        }

        .size-200 {
            font-size: 3px;
        }
    </style>
</head>

<body>

    <h1>🎨 ASCII Art Studio</h1>

    <div class="controls">
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>

            <div class="options-row">
                <select name="width" id="width">
                    <option value="50" {% if current_width==50 %}selected{% endif %}>📱 Mobil</option>
                    <option value="100" {% if current_width==100 %}selected{% endif %}>💻 PC</option>
                    <option value="150" {% if current_width==150 %}selected{% endif %}>🖥️ HD</option>
                    <option value="200" {% if current_width==200 %}selected{% endif %}>🔥 Ultra</option>
                </select>

                <select name="mode" id="mode">
                    <option value="color" {% if current_mode=='color' %}selected{% endif %}>🌈 Barevné</option>
                    <option value="bw" {% if current_mode=='bw' %}selected{% endif %}>⚫ Černobílé</option>
                </select>
            </div>

            <button type="submit">Generovat</button>
        </form>
    </div>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if ascii_art %}
    <div class="art-wrapper">
        <div class="ascii-art size-{{ current_width }}">
            {{ ascii_art }}
        </div>
    </div>
    <p style="font-size: 12px; color: #6b7280; margin-top: 10px;">
        Tip: Pro nejlepší efekt u černobílé fotky zvol HD kvalitu.
    </p>
    {% endif %}

</body>

</html>
